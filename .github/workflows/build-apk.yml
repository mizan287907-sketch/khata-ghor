name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp icon.png www/icon.png

      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "খাতা ঘর" com.khataghor.app --web-dir www
          npx cap add android
          npx cap sync android

      - name: Set app icon
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              cp icon-$d.png $RES/mipmap-$d/$n.png
            done
          done

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk khata-ghor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: khata-ghor-apk
          path: khata-ghor.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: খাতা ঘর APK ${{ github.run_number }}
          files: khata-ghor.apk
