:root[data-theme="dark"]{--desk:#16201B;--desk-ink:#D5E0D9;--panel:#1F2B25;--panel-line:#3B4A42;--muted:#9DB0A5;--btn:#5FB98A;--btn-ink:#0E1A13;color-scheme:dark}
body{background:var(--desk);color:var(--desk-ink);font-family:var(--font);padding-block:12px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{max-width:760px;margin:0 auto 10px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.btns{display:flex;flex-wrap:wrap;justify-content:flex-start;gap:6px;width:100%}

#panel,#filePanel{max-width:760px;margin:0 auto 14px;background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:14px;min-width:0}

.act{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.act button{font:inherit;font-size:15px;font-weight:600;padding:10px 14px;border-radius:10px;border:1.5px solid var(--btn);background:transparent;color:var(--desk-ink);cursor:pointer}
.act button.del{border-color:var(--red);color:var(--red)}
.act span{font-size:14px;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.fields label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);min-width:0}

.reset{margin-top:14px}
.seg.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--panel-line);min-width:0}
.item .grow{min-width:0;flex:1}
.item .t{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.item .t em{font-style:normal;font-size:12px;font-weight:600;background:var(--btn);color:var(--btn-ink);border-radius:6px;padding:1px 7px;margin-left:6px}
.item .s{font-size:13px;color:var(--muted);line-height:1.6}
.item .due{color:var(--red)}
.btnc{display:flex;gap:6px;flex:none}
.btnc button{font:inherit;font-size:14px;font-weight:600;padding:8px 12px;border-radius:9px;border:1.5px solid var(--btn);background:transparent;color:var(--desk-ink);cursor:pointer}
.btnc button.del{border-color:var(--red);color:var(--red)}
.empty{font-size:14px;color:var(--muted);margin:12px 0 4px;line-height:1.6}
.addc{display:flex;gap:8px;margin:12px 0 4px}
.addc input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--desk-ink);background:transparent;border:1px solid var(--panel-line);border-radius:8px;padding:9px 10px}
.addc input:focus{outline:2px solid var(--btn)}

#saveState{font-weight:600}

.hub-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}

.clist{display:flex;flex-direction:column;gap:6px}

.cr{flex:1;min-width:0}

.cname span{font-size:13px;color:var(--muted)}
.cname em{font-style:normal;font-weight:700;color:var(--red)}
.hubgrid.cfiles{grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:2px;margin:0 0 8px}
.cfiles .frow .fi,.cfiles .frow .fi svg{width:32px;height:32px}
.cfiles .frow .tt{font-size:12px}
.cico:focus-visible,.cname:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.clist{gap:0}.crow{gap:8px;align-items:flex-start;border-bottom:1.5px solid rgba(128,128,128,.35)}
.cico{width:40px;height:46px;border-radius:8px}.cico svg{width:28px;height:28px}
.cname{flex-direction:row;align-items:center;justify-content:space-between;gap:10px;min-height:46px;padding:6px 2px}
.cname b{font-size:18px}.cname span{white-space:nowrap;font-size:14px}
.hubgrid.cfiles{margin:0 0 10px}
.cico,.cname span{display:none}.cname b{font-size:16px}.cname{min-height:34px;padding:3px 4px}.crow{border-bottom-width:1px;align-items:flex-start}.cdel{flex:none;font:inherit;font-size:18px;line-height:1;color:var(--muted);background:transparent;border:0;min-width:40px;min-height:34px;cursor:pointer;border-radius:8px}.cdel.ask{font-size:12px;font-weight:700;color:var(--red);min-width:64px}.newrow{padding:2px 0 0 4px}.newrow input{font-size:16px;min-height:34px}.newrow .nno{min-width:0;text-align:left;font-size:16px;font-weight:600}.newrow{padding:0 0 0 4px;gap:6px}.hubgrid.cfiles{margin:0 0 6px}.cname{padding:6px 4px}.cname b{font-weight:600}.crow.open .cname b{color:var(--btn)}
.newrow{border-bottom:1.5px solid rgba(128,128,128,.35);padding:6px 0 0 4px}.newrow input{border-bottom:0;min-height:40px}.nno{min-width:0;text-align:left}
.hubgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.hubgrid .frow{flex-direction:column;justify-content:flex-start;align-items:center;text-align:center;gap:4px;padding:10px 4px 8px;margin:0;border-color:transparent;border-radius:10px}
.hubgrid .frow:hover,.hubgrid .frow:active{background:var(--desk)}
.hubgrid .frow .ar{display:none}
.hubgrid .frow .tt{flex:none;width:100%;font-size:13px;line-height:1.35}
.hubgrid .frow .sub{font-size:11px;margin-top:2px}
.hubgrid .frow .fi,.hubgrid .frow .fi svg{width:44px;height:44px}
.frow .fi{width:34px;height:34px;flex:none;color:var(--btn)}
.frow .fi svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.frow .tt{flex:1;min-width:0;font-size:16px;font-weight:600;overflow-wrap:anywhere}
.frow .sub{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:1px}
.frow .sub .due{color:var(--red)}
.frow .ar{color:var(--muted);font-size:22px;flex:none}
.dpage{background:var(--paper);color:var(--ink);border-radius:10px;padding:16px;border:1px solid var(--panel-line)}
.dname{font-size:22px;font-weight:700;overflow-wrap:anywhere}
.ddate{font-size:18px;margin:2px 0 14px}
.dtab{width:100%;border-collapse:collapse;font-size:15px}
.dtab{table-layout:auto;min-width:0}
.dtab th{background:none;color:var(--ink);border:0;height:auto;font-size:15px;text-align:left;font-weight:700;padding:6px 4px}
.dtab td{border:0;height:auto;padding:8px 4px;text-align:left;overflow-wrap:anywhere}
.dtab .r{text-align:right}
.dtot{text-align:right;font-weight:700;margin-top:12px;font-size:16px}
.dnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.dnav button{font:inherit;font-size:14px;font-weight:600;padding:8px 12px;border-radius:9px;border:1.5px solid var(--btn);background:transparent;color:var(--desk-ink);cursor:pointer}
.dnav button.off{opacity:.35}
.dlab{font-weight:600;font-size:15px}
.hub-btn{font:inherit;font-size:15px;font-weight:600;padding:12px 14px;border-radius:10px;border:0;background:var(--btn);color:var(--btn-ink);cursor:pointer;width:100%}
.newrow{display:flex;align-items:center;gap:10px;padding:10px 4px 4px}.nno{font-weight:700;font-size:18px;min-width:34px;text-align:right}.newrow input{flex:1;min-width:0;font:inherit;font-size:18px;border:0;border-bottom:1.5px solid var(--btn);border-radius:0;background:transparent;color:inherit;padding:6px 2px;outline:none}.newrow input:focus{border-bottom-width:3px}
.addn{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}.addn textarea{font:inherit;font-size:16px;width:100%;min-height:76px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--btn);background:var(--field,transparent);color:inherit;resize:vertical;box-sizing:border-box}.addn .hint{font-size:13px;color:var(--muted);line-height:1.5;margin:0}.addn .note{font-size:13px;font-weight:600;margin:0}
.hubseg{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:10px}
.rt-wrap{overflow-x:auto;margin-top:10px}
.rt{width:100%;border-collapse:collapse;font-size:13px;min-width:320px}
.rt th{background:var(--btn);color:var(--btn-ink);padding:7px 6px;font-weight:600}
.rt td{border:1px solid var(--panel-line);padding:7px 6px;text-align:center;overflow-wrap:anywhere}

.sumrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 8px}
.sumrow div{border:1px solid var(--panel-line);border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;color:var(--muted)}

.addS{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px;margin:12px 0 4px}

.sn{width:36px;height:36px;border-radius:50%;background:var(--btn);color:var(--btn-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none}
.btnc button:focus-visible,.addc button:focus-visible,.addc input:focus-visible{outline:3px solid var(--navy);outline-offset:2px}

#fit{margin:0 auto;max-width:100%;overflow:hidden}
#fit.zoom{overflow-x:auto}
#paper{width:680px;transform-origin:top left;background:var(--paper);color:var(--ink);border:2px solid var(--navy);border-radius:14px;padding:5px;display:flex;flex-direction:column;aspect-ratio:210/297}
.inner{flex:1;border:1px solid var(--navy);border-radius:10px;padding:16px 12px 18px;min-width:0;display:flex;flex-direction:column}
.head{display:flex;align-items:center;gap:10px}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}

.title{flex:1;min-width:0;text-align:center;font-size:38px;font-weight:700;color:var(--green-title);line-height:1.35;padding-right:52px;text-wrap:balance}

#d{width:130px}
#kn{width:90px}
.wrap{overflow-x:auto;border-radius:4px;-webkit-overflow-scrolling:touch}
table{width:100%;min-width:0;border-collapse:collapse;table-layout:fixed;font-size:15px}
th{background:var(--green);color:#fff;font-weight:600;font-size:14px;padding:6px 2px;border:1px solid var(--green);height:36px;line-height:1.3}
td{border:1px solid var(--grid);height:34px;padding:0;text-align:center}

function pGira(u,s){if(u!==PUNITS[1])return null;var t=String(s||'').replace(/[\u09E6-\u09EF]/g,function(c){return BN.indexOf(c);}).replace(/[^\d.]/g,'').split('.');return {w:parseInt(t[0],10)||0,g:t.length>1?(parseInt(t[1],10)||0):0};}
function pQty(u,s){var x=pGira(u,s);return x?x.w+x.g/16:toNum(s);}
function pBad(u,s){var x=pGira(u,s);return !!x&&x.g>=16;}
function pUnitTxt(p,u){var x=(p.u||{})[u]||{};return pBad(u,x.q)?'\u09AD\u09C1\u09B2':pFmt(pUnitTot(p,u));}

/* প্রতিষ্ঠানের হিসাব: একদিনের বিক্রি, মূলধন ও লাভ */
var PDATE=null,PERR='';
function instList(){if(ns===1)return saved;var l=lsGet(lsk(1),{});return Object.keys(l).map(function(k){var o=l[k];o.id=k;return o;});}

function instRows(){var all=instAllRows();if(PKH&&instKhatas().indexOf(PKH)<0)PKH=null;return PKH?all.filter(function(r){return kKey(r)===PKH;}):all;}
function instDay(dkey){
  var rows=instRows(),seen={},dates=[];
  rows.forEach(function(r){if(!seen[r.dt.key]){seen[r.dt.key]=1;dates.push(r.dt.key);}});
  var tk1=todayKey();if(!seen[tk1]){seen[tk1]=1;dates.push(tk1);}

  if(dates.length){if(dkey&&seen[dkey])date=dkey;else{var tk=todayKey();if(seen[tk])date=tk;else{var le=dates.filter(function(k){return k<=tk;});date=le.length?le[le.length-1]:dates[dates.length-1];}}}

}
function pNm(x){x=String(x||'');try{x=x.normalize('NFC');}catch(e){}return x.replace(/[\u200B-\u200D\uFEFF]/g,'').replace(/\s+/g,' ').trim();}
function pFind(nm){nm=pNm(nm);if(!nm)return null;var i,ex=null,part=[];for(i=0;i<PROD.length;i++){var n=pNm(PROD[i].name);if(!n)continue;if(n===nm){ex=PROD[i];if(pHasPrice(PROD[i]))return PROD[i];}else if(n.indexOf(nm)>-1||nm.indexOf(n)>-1)part.push(PROD[i]);}
  var pp=part.filter(pHasPrice);if(ex)return ex;var cand=pp.length?pp:part;if(cand.length>1)return null;var g=cand.length?cand[0]:null;if(g){PGUESS[nm]=pNm(g.name);}return g;}
var PGUESS={};
function pHasPrice(p){var us=pUnitsOf(p),k;for(k=0;k<us.length;k++){if(toNum(((p.u||{})[us[k]]||{}).p)>0)return true;}return false;}
function pCost(r){var p=pFind(r.mal);if(!p)return null;var us=pUnitsOf(p),k,x,pr;for(k=0;k<us.length;k++){x=(p.u||{})[us[k]]||{};pr=toNum(x.p);if(pr>0){if(pBad(us[k],r.qty))return null;return pr*pQty(us[k],r.qty);}}return null;}

var PMODE='d',PMON=null;
function instCalc(rows){var o={sale:0,sm:0,cost:0,miss:[]};rows.forEach(function(r){o.sale+=r.t;var c=pCost(r);if(c===null){if(o.miss.indexOf(r.mal||'-')<0)o.miss.push(r.mal||'-');}else{o.cost+=c;o.sm+=r.t;}});o.profit=o.sm-o.cost;return o;}
function instMon(mk){
  var rows=instRows(),seen={},ms=[];
  rows.forEach(function(r){var k=r.dt.y*100+r.dt.m;if(!seen[k]){seen[k]=1;ms.push(k);}});
  var d1=new Date(),cm1=d1.getFullYear()*100+d1.getMonth()+1;if(!seen[cm1]){seen[cm1]=1;ms.push(cm1);}
  ms.sort(function(a,b){return a-b;});
  var m=null;
  if(ms.length){if(mk&&seen[mk])m=mk;else{var d=new Date(),tk=d.getFullYear()*100+d.getMonth()+1;if(seen[tk])m=tk;else{var le=ms.filter(function(k){return k<=tk;});m=le.length?le[le.length-1]:ms[ms.length-1];}}}
  return{months:ms,mon:m,idx:ms.indexOf(m),rows:rows.filter(function(r){return r.dt.y*100+r.dt.m===m;})};
}

var PYR=null;
function instYr(yk){
  var rows=instRows(),seen={},ys=[];
  rows.forEach(function(r){var k=r.dt.y;if(!seen[k]){seen[k]=1;ys.push(k);}});
  ys.sort(function(a,b){return a-b;});
  var y=null;
  if(ys.length){if(yk&&seen[yk])y=yk;else{var ty=new Date().getFullYear();if(seen[ty])y=ty;else{var le=ys.filter(function(k){return k<=ty;});y=le.length?le[le.length-1]:ys[ys.length-1];}}}
  return{years:ys,year:y,idx:ys.indexOf(y),rows:rows.filter(function(r){return r.dt.y===y;})};
}
function instYear(){

  var by={},keys=[];yy.rows.forEach(function(r){var k=r.dt.m;if(!by[k]){by[k]=[];keys.push(k);}by[k].push(r);});
  keys.sort(function(a,b){return a-b;});
  var rows='';keys.forEach(function(k){var d=instCalc(by[k]);rows+='<tr><td>'+MONTHS[k-1]+'</td><td>'+fmtN(d.sale)+'</td><td>'+fmtN(d.cost)+'</td><td>'+fmtN(d.profit)+'</td></tr>';});
  h+='<div class="rt-wrap rtw7"><table class="rt rt7"><thead><tr><th>মাস</th><th>বিক্রি</th><th>মূলধন</th><th>লাভ</th></tr></thead><tbody>'+rows+'<tr class="rtot"><td>মোট</td><td>'+fmtN(c.sale)+'</td><td>'+fmtN(c.cost)+'</td><td>'+fmtN(c.profit)+'</td></tr></tbody></table></div>';
  return h;
}
function instSeg(){return '<div class="seg hubseg"><button type="button" data-im="d" aria-pressed="'+(PMODE==='d')+'">দৈনিক</button><button type="button" data-im="m" aria-pressed="'+(PMODE==='m')+'">মাসিক</button><button type="button" data-im="y" aria-pressed="'+(PMODE==='y')+'">বছর</button></div>'+instKh();}
function instKh(){var l=instKhatas();if(l.length<2)return'';var ix=PKH?l.indexOf(PKH):-1;
  return '<div class="khstep"><button type="button" class="pchip'+(PKH?'':' on')+'" data-ik="all">সব খাতা</button><div class="khbox"><button type="button" data-ikn="-1" aria-label="আগের খাতা"'+(PKH&&ix<=0?' class="off"':'')+'>‹</button><span>'+(PKH?'খাতা '+PKH:'খাতা বাছুন')+'</span><button type="button" data-ikn="1" aria-label="পরের খাতা"'+(PKH&&ix>=l.length-1?' class="off"':'')+'>›</button></div></div>';}
function instMonth(){
  var mm=instMon(PMON);PMON=mm.mon;
  var y=Math.floor(mm.mon/100),mo=mm.mon%100;
  var h='<div class="dnav"><button type="button" data-imm="-1" class="'+(mm.idx>0?'':'off')+'">‹ আগের মাস</button><span class="dlab">'+MONTHS[mo-1]+' '+toBn(y)+'</span><button type="button" data-imm="1" class="'+(mm.idx<mm.months.length-1?'':'off')+'">পরের মাস ›</button></div>';
  if(!mm.rows.length)return h+'<p class="empty">এই মাসে কোনো বিক্রির হিসাব নেই।</p>';
  var c=instCalc(mm.rows);
  h+='<div class="sumrow"><div>মোট বিক্রি<b>'+fmtN(c.sale)+'</b></div><div>মূলধন<b>'+fmtN(c.cost)+'</b></div><div>লাভ<b>'+fmtN(c.profit)+'</b></div></div>';
  var by={},keys=[];mm.rows.forEach(function(r){var k=r.dt.key;if(!by[k]){by[k]=[];keys.push(k);}by[k].push(r);});
  keys.sort(function(a,b){return a-b;});
  var rows='';keys.forEach(function(k){var d=instCalc(by[k]);rows+='<tr><td>'+fd(k)+'</td><td>'+fmtN(d.sale)+'</td><td>'+fmtN(d.cost)+'</td><td>'+fmtN(d.profit)+'</td></tr>';});

function instHtml0(){

  return h;
}
(function(){var po=$('p2opts');if(!po)return;pLoad();pRender();
  function add(){var t=$('pIn'),v=t.value.trim();if(!v)return;var vn=pNm(v),dup=PROD.some(function(x){return pNm(x.name)===vn;});if(dup){PERR='"'+v+'" নামে পণ্য আগেই আছে। রং বা সাইজ যোগ করে আলাদা নাম দিন, যেমন: '+v+' লাল';pRender();var n0=$('pIn');if(n0){n0.value=v;n0.focus();}return;}PERR='';PROD.push({name:v,u:{},sel:pAuto(v)});POPEN=PROD.length-1;PDEL=-1;pSave();pRender();var n=$('pIn');if(n)n.focus();}
  po.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.dataset.im){PMODE=b.dataset.im;pRender();return;}
    if(b.dataset.ikn){var kl=instKhatas(),kx=PKH?kl.indexOf(PKH):-1,nx=+b.dataset.ikn;if(kx<0)kx=nx>0?-1:kl.length;kx+=nx;if(kx>=0&&kx<kl.length){PKH=kl[kx];PDATE=null;PMON=null;PYR=null;pRender();}return;}
    if(b.dataset.ik!==undefined){PKH=b.dataset.ik==='all'?null:b.dataset.ik;PDATE=null;PMON=null;PYR=null;pRender();return;}
    if(b.dataset.iyy){var w=instYr(PYR),nk=w.idx+(+b.dataset.iyy);if(nk>=0&&nk<w.years.length){PYR=w.years[nk];pRender();}return;}
    if(b.dataset.imm){var q=instMon(PMON),nj=q.idx+(+b.dataset.imm);if(nj>=0&&nj<q.months.length){PMON=q.months[nj];pRender();}return;}
    if(b.dataset.pc!==undefined){var a=b.dataset.pc.split('|'),pp=PROD[+a[0]];if(pp){var cur=pUnitsOf(pp).slice(),ix=cur.indexOf(a[1]);if(ix>-1)cur.splice(ix,1);else cur.push(a[1]);pp.sel=cur;pSave();pRender();}return;}
    if(b.dataset.idd){var m=instDay(PDATE),ni=m.idx+(+b.dataset.idd);if(ni>=0&&ni<m.dates.length){PDATE=m.dates[ni];pRender();}return;}
    if(b.id==='pAdd'){add();return;}
    if(b.dataset.pt!==undefined){var i=+b.dataset.pt;POPEN=(POPEN===i?-1:i);PDEL=-1;pRender();return;}
    if(b.dataset.pd!==undefined){var d=+b.dataset.pd;if(PDEL===d){PROD.splice(d,1);PDEL=-1;if(POPEN===d)POPEN=-1;else if(POPEN>d)POPEN--;pSave();}else PDEL=d;pRender();}

    p.u=p.u||{};p.u[u]=p.u[u]||{};p.u[u][t.dataset.pf]=t.value;pSave();

  });
})();

  <input id="licCode" autocomplete="off" autocapitalize="characters" placeholder="অ্যাক্টিভেশন কোড" style="width:100%;box-sizing:border-box;font-size:20px;padding:12px;border:2px solid #134428;border-radius:12px;text-transform:uppercase">
  <button id="licBtn" type="button" style="width:100%;margin-top:12px;padding:13px;font-size:18px;font-weight:700;color:#fff;background:#134428;border:0;border-radius:12px">সক্রিয় করুন</button>
  <button id="licView" type="button" style="display:none;width:100%;margin-top:10px;padding:12px;font-size:16px;color:#134428;background:#fff;border:2px solid #134428;border-radius:12px">শুধু পুরনো হিসাব দেখুন</button>
  <div id="licDev" style="margin-top:14px;font-size:12px;color:#889;word-break:break-all"></div>
 </div>
</div>
<div id="licBar"><span id="licBarTxt"></span><button id="licBarBtn" type="button">কোড দিন</button></div>
<script id="licJs">
(function(){
var LICENSE_URL='https://script.google.com/macros/s/AKfycbxgwGZpF1eOmWC-z0PHdzmQDMFF-RJoFx4wRkZEdlXRhLU06RcHUyPN40ZsJa7RynLSHQ/exec';
if(!/^https:\/\//.test(LICENSE_URL))return;
var KEY='lic_v1',DK='lic_dev',DAY=86400000;
var $=function(i){return document.getElementById(i);};
var gate=$('licGate'),msg=$('licMsg'),codeIn=$('licCode'),btn=$('licBtn'),viewBtn=$('licView'),devEl=$('licDev'),bar=$('licBar'),barTxt=$('licBarTxt'),barBtn=$('licBarBtn');
function lg(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function ls(k,v){try{localStorage.setItem(k,v);}catch(e){}}
var device=lg(DK);
if(!device){var rnd=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2));device=String(rnd).replace(/-/g,'');ls(DK,device);}
devEl.textContent='ডিভাইস আইডি: '+device.slice(-6).toUpperCase();
var lic=null;try{lic=JSON.parse(lg(KEY)||'null');}catch(e){lic=null;}
function save(l){lic=l;ls(KEY,JSON.stringify(l));}
function ro(on){document.body.classList.toggle('lic-ro',!!on);}
function show(m,canView){gate.style.display='block';bar.style.display='none';msg.textContent=m;viewBtn.style.display=canView?'block':'none';btn.disabled=false;btn.textContent='সক্রিয় করুন';}
function hide(){gate.style.display='none';}
function setBar(t){if(!t){bar.style.display='none';return;}barTxt.textContent=t;bar.style.display='flex';}
function active(){ro(false);hide();var d=Math.ceil((lic.exp-Date.now())/DAY);setBar(d<=30?('লাইসেন্সের মেয়াদ আর '+d+' দিন বাকি'):'');}
function call(code){return fetch(LICENSE_URL+'?code='+encodeURIComponent(code)+'&device='+encodeURIComponent(device),{redirect:'follow'}).then(function(r){return r.json();});}
function localState(){if(!lic||!lic.exp)return 'none';var n=Date.now();if(n<(lic.last||0)-DAY)return 'clock';if(n>=lic.exp)return 'exp';return 'ok';}
function touch(){if(lic&&Date.now()>(lic.last||0)){lic.last=Date.now();save(lic);}}
function readOnlyMode(t){ro(true);hide();setBar(t);}
function refresh(){
  if(!lic||!lic.code)return Promise.resolve();
  return call(lic.code).then(function(d){
    if(d&&d.ok){save({code:lic.code,exp:d.expires,last:Date.now()});active();}
    else if(d&&d.expired){lic.exp=d.expires;save(lic);show('লাইসেন্সের মেয়াদ শেষ। নবায়নের জন্য যিনি অ্যাপ দিয়েছেন তার সাথে যোগাযোগ করুন, অথবা নতুন কোড দিন।',true);}
    else if(d){show((d.msg||'লাইসেন্স যাচাই হয়নি')+'। যিনি অ্যাপ দিয়েছেন তার সাথে যোগাযোগ করুন।',true);}
  }).catch(function(){});
}
btn.addEventListener('click',function(){
  var c=codeIn.value.trim().toUpperCase();
  if(!c){msg.textContent='অ্যাক্টিভেশন কোড লিখুন।';return;}
  btn.disabled=true;btn.textContent='যাচাই হচ্ছে...';
  call(c).then(function(d){
    if(d&&d.ok){save({code:c,exp:d.expires,last:Date.now()});active();}
    else{msg.textContent=(d&&d.msg)||'সক্রিয় হয়নি';btn.disabled=false;btn.textContent='সক্রিয় করুন';}
  }).catch(function(){msg.textContent='ইন্টারনেট নেই। প্রথমবার সক্রিয় করতে ইন্টারনেট লাগবে।';btn.disabled=false;btn.textContent='সক্রিয় করুন';});
});
viewBtn.addEventListener('click',function(){readOnlyMode('লাইসেন্স শেষ, এখন শুধু পুরনো হিসাব দেখা যাবে');});
barBtn.addEventListener('click',function(){var ex=lic&&lic.exp&&Date.now()>=lic.exp;show(ex?'নবায়নের জন্য নতুন কোড দিন।':'নতুন কোড দিন।',ex);});
var st=localState();
if(st==='ok'){touch();active();refresh();}
else if(st==='clock'){show('ফোনের তারিখ-সময় ঠিক নেই। তারিখ ঠিক করে ইন্টারনেট চালু করুন।',true);refresh();}
else if(st==='exp'){show('লাইসেন্সের মেয়াদ শেষ। নবায়নের জন্য যিনি অ্যাপ দিয়েছেন তার সাথে যোগাযোগ করুন, অথবা নতুন কোড দিন।',true);refresh();}
else{show('অ্যাপ চালু করতে আপনার অ্যাক্টিভেশন কোড দিন। প্রথমবার ইন্টারনেট লাগবে।',false);}
})();
</script>
